plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.daigorian.epcltvapp"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.daigorian.epcltvapp"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 38
        versionName "1.38"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.30.5"
        }
    }

    signingConfigs {
        release {
            // CI(GitHub Actions)は RELEASE_KEYSTORE_* を環境変数で渡す(release.yml)。
            // 環境変数がないローカルでは debug と同じ鍵にフォールバックする。性能計測などで
            // リリースビルド(非debuggable)を手元で動かすためのもので、配布物には使えない。
            storeFile     file(System.getenv("RELEASE_KEYSTORE_PATH") ?: signingConfigs.debug.storeFile)
            storePassword System.getenv("RELEASE_STORE_PASSWORD")     ?: signingConfigs.debug.storePassword
            keyAlias      System.getenv("RELEASE_KEY_ALIAS")          ?: signingConfigs.debug.keyAlias
            keyPassword   System.getenv("RELEASE_KEY_PASSWORD")       ?: signingConfigs.debug.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.5.0'
    def leanback_version = "1.0.0"
    implementation "androidx.leanback:leanback:$leanback_version"
    implementation "androidx.leanback:leanback-preference:$leanback_version"

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    //EPGStation API を利用するための retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // アップデートダイアログでリリースノート(Markdown)を整形して表示するためのパーサ。
    // Java 11 前提だが core library desugaring は不要 (本家の Android テストモジュールが
    // minSdk 19 / Java 11 / desugaring なしで通っている)。
    // 表の拡張がないと "| a | b |" がパイプ付きのまま表示されてしまうので併せて入れる。
    def commonmark_version = "0.30.0"
    implementation "org.commonmark:commonmark:$commonmark_version"
    implementation "org.commonmark:commonmark-ext-gfm-tables:$commonmark_version"

    def preference_version = "1.1.1"
    implementation "androidx.preference:preference-ktx:$preference_version"

    //ExoPlayer (Media3) + Leanback integration
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation "androidx.media3:media3-ui-leanback:$media3_version"
    // SubtitleView(Cue描画)のみ利用する。media3-ui-leanback は media3-ui を
    // 推移的に持たないため個別に追加が必要。
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 単体テスト。JVM 上で動く (エミュレータ不要)。APK には含まれない。
    testImplementation 'junit:junit:4.13.2'
}